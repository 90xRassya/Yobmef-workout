<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WorkUp</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏋️ WorkUp</h1>
    </header>

    <main>

        <section class="hero">
            <h2>Today's Workout</h2>
            <p>Stay consistent, one workout at a time.</p>

            <button id="startBtn">Start Workout</button>
        </section>

        <section class="workout-list">
            <h2>Exercises</h2>

            <div class="exercise">💪 Push Up</div>
            <div class="exercise">🦵 Squat</div>
            <div class="exercise">🧘 Plank</div>
            <div class="exercise">🍑 Glute Bridge</div>
        </section>

    </main>

    <footer>
        <p>© 2026 WorkUp</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
